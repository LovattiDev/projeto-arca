<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- GLOBAL -->
    <link rel="stylesheet" href="./../style/colors.css">
    <link rel="stylesheet" href="./../style/fonts.css">
    <link rel="stylesheet" href="./../style/global.css">

    <!-- PAGES -->
    <link rel="stylesheet" href="./../style/pages/register.css">

    <!-- COMPONENTS -->
    <link rel="stylesheet" href="./../style/components/header.css">
    <link rel="stylesheet" href="./../style/components/footer.css">

</head>
<body>

    <!-- HEADER -->
    <header class="header">
            <div class="container">

                <div class="header-content">

                    <a href="./../" class="header-logo">
                        <img src="./../assets/img/arca-01.png" alt="Logo Projeto ARCA">
                    </a>

                    <nav class="header-nav">
                        <ul>
                            <li><a href="./../index.html">Home</a></li>
                            <li><a href="./adoption.html">Adoção</a></li>
                            <li><a href="./castration.html">Castração</a></li>
                        </ul>
                    </nav>

                    <a href="./admin.html">
                        <button class="header-profile">
                            <span>◎</span>
                        </button>
                    </a>

                </div>

            </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <div class="container container-register-main">

            <div class="page-title">
                <h1>Cadastro de Animal</h1>
            </div>

            <div class="page-content">

                <form action="/cadastrar-pet" method="POST">
    
                    <label>Tipo de Animal:</label>
                    <div class="radio-group">
                        <input type="radio" id="tipo_cao" name="tipo_animal" value="cao" required>
                        <label for="tipo_cao">Cão</label>

                        <input type="radio" id="tipo_gato" name="tipo_animal" value="gato">
                        <label for="tipo_gato">Gato</label>
                    </div>

                    <label for="nome_pet">Nome do Pet:</label>
                    <input type="text" id="nome_pet" name="nome_pet" placeholder="Ex: Bob" required>

                    <label for="idade_pet">Idade (em anos):</label>
                    <input type="number" id="idade_pet" name="idade_pet" min="0" max="30" placeholder="Ex: 3" required>

                    <label for="raca_pet">Raça:</label>
                    <input type="text" id="raca_pet" name="raca_pet" placeholder="Ex: Labrador ou SRD" required>

                    <label for="porte_pet">Porte:</label>
                    <select id="porte_pet" name="porte_pet" required>
                        <option value="" disabled selected>Selecione o porte</option>
                        <option value="pequeno">Pequeno</option>
                        <option value="medio">Médio</option>
                        <option value="grande">Grande</option>
                    </select>

                    <label>Histórico:</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="vacinado" name="saude[]" value="vacinado">
                        <label for="vacinado">Vacinado</label>

                        <input type="checkbox" id="castrado" name="saude[]" value="castrado">
                        <label for="castrado">Castrado</label>
                    </div>

                    <label for="observacoes">Observações Médicas ou Comportamentais:</label>
                    <textarea id="observacoes" name="observacoes" rows="4" placeholder="Alguma restrição alimentar ou alergia?"></textarea>

                    <button type="submit">Cadastrar Pet</button>
                </form>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">

            <div class="footer-content">

                <div class="footer-brand">
                    <h3>PROJETO ARCA</h3>
                </div>

                <div class="footer-links">

                    <div class="footer-column">
                        <h4>SERVIÇOS</h4>

                        <ul>
                            <li><a href="./adoption.html">Adoção</a></li>
                            <li><a href="./castration.html">Castração</a></li>
                            <li><a href="./ngo.html">Para ong-section</a></li>
                        </ul>
                    </div>

                </div>

            </div>

            <div class="footer-bottom">
                <p>Copyright © 2026 Projeto ARCA</p>
            </div>

        </div>
    </footer>
    
</body>
</html>
